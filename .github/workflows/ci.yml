name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon update
      - name: Verify one source commit
        run: moon run scripts/acceptance.mbtx all HEAD
        env:
          JIEHENG_EVIDENCE_DIR: ${{ runner.temp }}/jieheng-evidence
      - name: Retain validation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jieheng-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/jieheng-evidence/**/*.json
            ${{ runner.temp }}/jieheng-evidence/**/*.log
            ${{ runner.temp }}/jieheng-evidence/**/*.txt
            !${{ runner.temp }}/jieheng-evidence/**/source/**
            !${{ runner.temp }}/jieheng-evidence/**/workspace/**
