name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon update
      - run: moon run scripts/verify.mbtx all HEAD
      - run: moon run scripts/distribution.mbtx all archive
      - run: moon run scripts/generative.mbtx all
      - run: moon run scripts/benchmark.mbtx all baseline
