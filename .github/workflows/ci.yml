name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon version --all
      - run: moon fmt
      - run: moon info
      - run: git diff --exit-code
      - run: moon check --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon run cmd/demo --target wasm
      - run: moon run cmd/demo --target wasm-gc
      - run: moon run cmd/demo --target js
      - run: moon run cmd/demo --target native
